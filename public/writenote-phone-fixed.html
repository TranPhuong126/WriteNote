<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>WriteNote — Viết từ điện thoại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2340; --paper:#FBF7EE; --paper-edge:#EDE6D6;
    --accent:#3F6B4A; --line-strong:rgba(27,35,64,0.18); --muted:#6B6F76;
    --err:#8c3030;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--paper-edge);overscroll-behavior:none;}
  .wrap{display:flex;flex-direction:column;height:100%;min-height:100dvh;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    min-height:58px;padding:10px 14px;background:var(--paper-edge);border-bottom:1px solid var(--line-strong);
    padding-top:max(10px, env(safe-area-inset-top));
    gap:8px;
  }
  .wordmark{font-family:'Caveat',cursive;font-size:25px;font-weight:700;color:var(--ink);letter-spacing:.2px;flex:none;}
  .wordmark span{color:var(--accent);}
  .headerRight{display:flex;align-items:center;gap:6px;}
  #status{font-size:11px;color:var(--accent);font-weight:600;background:rgba(255,255,255,.55);border:1px solid var(--line-strong);border-radius:999px;padding:6px 9px;white-space:nowrap;}
  #status.err{color:var(--err);}
  #debugToggle{font-size:11px;padding:6px 9px;min-height:auto;border-radius:999px;}
  /* Banner lỗi JS runtime — mục tiêu chính: KHÔNG BAO GIỜ để màn hình trắng trơn khi có lỗi */
  #fatalError{
    display:none;padding:10px 12px;background:#4a1414;color:#ffe9e9;
    font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word;border-bottom:1px solid rgba(255,255,255,.15);
  }
  #fatalError .hdr{font-weight:700;color:#ffb3b3;margin-bottom:4px;font-family:'Inter',sans-serif;font-size:12px;}
  #roomNotice{margin:10px 12px 0;padding:10px 12px;border:1px solid rgba(155,50,50,.25);border-radius:9px;background:#fff5f3;color:var(--err);font-size:12px;line-height:1.5;}
  #roomNotice ul{margin:6px 0 0;padding-left:18px;}
  #debugPanel{margin:10px 12px 0;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;color:var(--ink);font-size:11.5px;line-height:1.6;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;}
  /* Viewport: khung nhìn cố định, "cắt" (clip) phần canvas bị phóng to/kéo ra
     ngoài rìa màn hình. Đây là hệ quy chiếu KHÔNG đổi để tính toạ độ chạm. */
  #canvasViewport{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--paper-edge);}
  /* canvas là "tờ giấy logic" kích thước cố định (bằng đúng khung nhìn lúc
     zoom 100%) — phóng to/kéo chỉ áp dụng transform lên chính canvas này,
     KHÔNG resize lại buffer vẽ bên trong, nên nét vẽ luôn khớp tuyệt đối
     với toạ độ gốc của tờ giấy, bất kể đang zoom/pan ở mức nào.
     QUAN TRỌNG: kiểu nền + màu nền trang (đồng bộ với laptop) được set
     TRỰC TIẾP làm CSS background của CHÍNH canvas này (qua JS, xem
     applyPageBackground()) — KHÔNG dùng thêm một <div> nền riêng đè phía
     dưới rồi tự đồng bộ transform cho nó, vì cách đó từng gây lỗi trình
     duyệt di động render ra MÀN HÌNH ĐEN khi đang pinch-zoom (2 lớp
     transform trong suốt chồng nhau bị lỗi compositing trên một số máy).
     Chỉ 1 phần tử duy nhất bị transform, giống hệt cấu trúc gốc ban đầu. */
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;background:var(--paper);display:block;transform-origin:0 0;}
  #zoomBadge{font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.55);border:1px solid var(--line-strong);border-radius:999px;padding:6px 9px;min-height:auto;white-space:nowrap;}
  #pageBadge{font-size:11px;color:var(--ink);background:rgba(255,255,255,.55);border:1px solid var(--line-strong);border-radius:999px;padding:6px 9px;white-space:nowrap;cursor:pointer;touch-action:manipulation;}
  #pageBadge:active{transform:translateY(1px);}
  .toolbar{
    display:flex;align-items:center;gap:7px;padding:9px 12px;
    padding-bottom:max(9px, env(safe-area-inset-bottom));
    background:var(--paper-edge);border-top:1px solid var(--line-strong);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;flex:none;}
  .swatch.active{border-color:var(--ink);}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
    border-radius:9px;padding:10px 13px;min-height:42px;flex:none;touch-action:manipulation;
  }
  button:active{transform:translateY(1px);}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  @media (max-width:420px){
    header{min-height:54px;padding-left:12px;padding-right:12px;}
    .wordmark{font-size:23px;}
    #status{font-size:10px;padding:5px 8px;}
    .toolbar{gap:6px;padding-left:10px;padding-right:10px;}
    button{padding-left:11px;padding-right:11px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">Write<span>Note</span></div>
    <div class="headerRight">
      <button id="pageBadge" type="button" hidden title="Chạm để đổi trang"></button>
      <div id="status">Đang khởi tạo...</div>
      <button id="zoomBadge" type="button" title="Chạm để đặt lại 100%">100%</button>
      <button id="debugToggle" type="button">Chi tiết</button>
    </div>
  </header>
  <!-- Bắt mọi lỗi JS runtime chưa xử lý -> hiển thị thay vì để trắng màn hình -->
  <div id="fatalError"></div>
  <div id="roomNotice" hidden></div>
  <div id="debugPanel" hidden></div>
  <div id="canvasViewport">
    <canvas id="board"></canvas>
  </div>
  <div class="toolbar" id="toolbar">
    <button data-tool="pen" class="active">Bút</button>
    <button data-tool="eraser">Tẩy</button>
    <div class="swatch active" style="background:#1B2340" data-color="#1B2340"></div>
    <div class="swatch" style="background:#9B3232" data-color="#9B3232"></div>
    <div class="swatch" style="background:#3F6B4A" data-color="#3F6B4A"></div>
    <div class="swatch" style="background:#1F5C7A" data-color="#1F5C7A"></div>
    <button id="clearBtn">Xoá</button>
  </div>
</div>

<script>
  // Nếu file socket.io.js không tải được (404 / server không phục vụ đúng path / mất mạng),
  // đánh dấu lại để script chính biết ngay, thay vì chờ "typeof io" âm thầm fail.
  window.__socketIoLoadFailed = false;
</script>
<script src="/socket.io/socket.io.js" onerror="window.__socketIoLoadFailed = true;"></script>
<script>
(function(){
  'use strict';

  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  const canvasViewport = document.getElementById('canvasViewport');
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const statusEl = document.getElementById('status');
  const roomNotice = document.getElementById('roomNotice');
  const fatalErrorEl = document.getElementById('fatalError');
  const debugPanel = document.getElementById('debugPanel');
  const debugToggle = document.getElementById('debugToggle');
  const zoomBadge = document.getElementById('zoomBadge');
  const pageBadge = document.getElementById('pageBadge');

  /* ================= Trang hiện tại (đồng bộ với laptop) =================
   * roomId (biến `room` ở trên) là cố định cho cả PHIÊN LÀM VIỆC (tài liệu),
   * không đổi khi laptop chuyển trang. pageId mới là thứ phân biệt "đang xem
   * trang nào" bên trong phiên đó — nhận qua sự kiện 'change-page'/'snapshot'. */
  let currentPageId = params.get('page') || null;
  let currentPageName = null;
  let currentPageIndex = null;
  let currentPageCount = null;
  // Kiểu nền (ruled/grid/dot/blank) + màu nền trang — nhận từ laptop qua
  // 'change-page'/'snapshot', luôn khớp với trang đang xem trên laptop.
  let currentPageBg = 'ruled';
  let currentPageBgColor = '#FBF7EE';
  // Màu kẻ dùng cho mọi kiểu nền, lấy từ chính biến CSS --line-strong đã
  // khai báo ở :root để không phải lặp lại giá trị màu ở 2 nơi.
  const LINE_COLOR = (getComputedStyle(document.documentElement).getPropertyValue('--line-strong') || '').trim() || 'rgba(27,35,64,0.18)';

  function updatePageBadge(){
    if(currentPageName && Number.isInteger(currentPageIndex) && Number.isInteger(currentPageCount)){
      pageBadge.hidden = false;
      // Mũi tên "›" gợi ý có thể chạm vào để chuyển sang trang kế tiếp.
      pageBadge.textContent = currentPageName + ' (' + (currentPageIndex+1) + '/' + currentPageCount + ')' + (currentPageCount > 1 ? ' ›' : '');
    }
  }
  function applyPageBackground(){
    // Set thẳng CSS background lên chính canvas (KHÔNG dùng div riêng), để
    // tránh lỗi màn hình đen khi zoom trên di động (xem ghi chú CSS ở trên).
    // Vì đây chỉ là style CSS của canvas (không phải bitmap vẽ bên trong),
    // nét vẽ (ink) trên canvas vẫn hiển thị đè lên trên bình thường.
    board.style.backgroundColor = currentPageBgColor;
    const line = LINE_COLOR;
    if(currentPageBg === 'grid'){
      board.style.backgroundImage =
        'repeating-linear-gradient(' + line + ' 0 1px, transparent 1px 24px),' +
        'repeating-linear-gradient(90deg, ' + line + ' 0 1px, transparent 1px 24px)';
      board.style.backgroundSize = '';
    } else if(currentPageBg === 'dot'){
      board.style.backgroundImage = 'radial-gradient(' + line + ' 1px, transparent 1.2px)';
      board.style.backgroundSize = '18px 18px';
    } else if(currentPageBg === 'blank'){
      board.style.backgroundImage = 'none';
      board.style.backgroundSize = '';
    } else { // 'ruled' (mặc định)
      board.style.backgroundImage = 'repeating-linear-gradient(' + currentPageBgColor + ' 0 27px, ' + line + ' 27px 28px)';
      board.style.backgroundSize = '';
    }
  }
  function applyPageMeta(p){
    if(!p) return;
    if(p.pageId) currentPageId = p.pageId;
    if(p.pageName) currentPageName = p.pageName;
    if(Number.isInteger(p.pageIndex)) currentPageIndex = p.pageIndex;
    if(Number.isInteger(p.pageCount)) currentPageCount = p.pageCount;
    if(p.bg) currentPageBg = p.bg;
    if(p.bgColor) currentPageBgColor = p.bgColor;
    updatePageBadge();
    applyPageBackground();
  }

  /* ================= Zoom / Pan (Vấn đề 1) =================
   * `board` (canvas) có ĐỘ PHÂN GIẢI VẼ CỐ ĐỊNH (baseWidth*2 x baseHeight*2,
   * xem resize()) — đây chính là "Logical Canvas": hệ toạ độ tuyệt đối của
   * tờ giấy, giống hệt dù đang zoom/pan ở mức nào. Phóng to/kéo trên điện
   * thoại chỉ là một CSS transform (scale + translate) áp lên canvas để
   * thay đổi KHUNG NHÌN hiển thị — không hề đụng tới toạ độ vẽ/gửi socket.
   * Nhờ vậy toạ độ gửi lên server luôn được tính trên hệ gốc của tờ giấy,
   * bù trừ đúng scale/scroll hiện tại, nên luôn khớp với Laptop. */
  let baseWidth = 0, baseHeight = 0; // kích thước "tờ giấy" lúc zoom 100% (CSS px, không đổi theo transform)
  let scale = 1, panX = 0, panY = 0;
  const MIN_SCALE = 1, MAX_SCALE = 6;
  const activePointers = new Map(); // pointerId -> {x,y} toạ độ màn hình (clientX/clientY)
  let pinch = null; // {prevDist, prevMid} khi có 2 ngón đang chạm
  let suppressDraw = false; // true trong lúc đang pinch, tránh vẽ nhầm khi nhấc bớt ngón

  function applyTransform(){
    board.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    zoomBadge.textContent = Math.round(scale * 100) + '%';
  }
  function clampPan(){
    const view = canvasViewport.getBoundingClientRect();
    const contentW = baseWidth * scale, contentH = baseHeight * scale;
    const minX = Math.min(0, view.width - contentW);
    const minY = Math.min(0, view.height - contentH);
    panX = Math.max(minX, Math.min(0, panX));
    panY = Math.max(minY, Math.min(0, panY));
  }
  function resetView(){
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  }
  zoomBadge.addEventListener('click', resetView);

  function ptsArray(){ return [...activePointers.values()]; }
  function dist2(pts){ return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y); }
  function mid2(pts){ return { x:(pts[0].x + pts[1].x) / 2, y:(pts[0].y + pts[1].y) / 2 }; }

  function beginPinch(){
    pinch = { prevDist: dist2(ptsArray()), prevMid: mid2(ptsArray()) };
  }
  function updatePinch(){
    if(!pinch) return;
    const rect = board.getBoundingClientRect();
    // Điểm trên tờ giấy hiện đang nằm dưới 2 ngón tay (tính theo transform hiện tại)
    const contentX = (pinch.prevMid.x - rect.left) / scale;
    const contentY = (pinch.prevMid.y - rect.top) / scale;
    const pts = ptsArray();
    const newDist = dist2(pts);
    const newMid = mid2(pts);
    let newScale = scale * (newDist / pinch.prevDist);
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    // Dời khung nhìn sao cho đúng điểm đó vẫn nằm dưới vị trí ngón tay mới
    panX = panX + (newMid.x - rect.left) - contentX * newScale;
    panY = panY + (newMid.y - rect.top) - contentY * newScale;
    scale = newScale;
    clampPan();
    applyTransform();
    pinch.prevDist = newDist;
    pinch.prevMid = newMid;
  }

  /* ================= Chẩn đoán & báo lỗi ================= */
  // startTime + trạng thái được gom lại để hiển thị trong bảng "Chi tiết"
  const diag = {
    startedAt: new Date().toISOString(),
    pageOrigin: location.origin,
    pageHref: location.href,
    room: room || '(không có)',
    socketIoScriptLoaded: null, // set bên dưới
    socketConnected: false,
    lastEvent: '(chưa có)',
    lastError: '(chưa có)',
    reconnectAttempts: 0
  };

  function renderDebug(){
    debugPanel.textContent =
      'Trang mở tại : ' + diag.pageHref + '\n' +
      'Origin       : ' + diag.pageOrigin + '\n' +
      'Room         : ' + diag.room + '\n' +
      'socket.io.js : ' + (diag.socketIoScriptLoaded === null ? '(đang kiểm tra)' : (diag.socketIoScriptLoaded ? 'đã tải' : 'KHÔNG tải được')) + '\n' +
      'Kết nối      : ' + (diag.socketConnected ? 'đã kết nối' : 'chưa kết nối') + '\n' +
      'Số lần thử lại: ' + diag.reconnectAttempts + '\n' +
      'Sự kiện cuối : ' + diag.lastEvent + '\n' +
      'Lỗi cuối     : ' + diag.lastError + '\n' +
      'Bắt đầu lúc  : ' + diag.startedAt;
  }
  debugToggle.addEventListener('click', function(){
    debugPanel.hidden = !debugPanel.hidden;
    if(!debugPanel.hidden) renderDebug();
  });

  // Banner đỏ cho lỗi JS chưa bắt được — đây là điểm mấu chốt để không còn "màn hình trắng trơn":
  // thay vì trang chết lặng, người dùng sẽ luôn thấy thông báo kèm nội dung lỗi cụ thể.
  function showFatalError(message, source){
    diag.lastError = (source ? '[' + source + '] ' : '') + message;
    fatalErrorEl.style.display = 'block';
    fatalErrorEl.innerHTML = '';
    const hdr = document.createElement('div');
    hdr.className = 'hdr';
    hdr.textContent = 'Đã xảy ra lỗi — trang vẫn hiển thị để bạn đọc thông tin debug bên dưới:';
    const body = document.createElement('div');
    body.textContent = diag.lastError + '\n(tại ' + diag.pageHref + ')';
    fatalErrorEl.appendChild(hdr);
    fatalErrorEl.appendChild(body);
    statusEl.textContent = 'Lỗi';
    statusEl.classList.add('err');
    debugPanel.hidden = false;
    renderDebug();
  }
  window.addEventListener('error', function(e){
    showFatalError(e && e.message ? e.message : 'Lỗi không xác định', 'window.onerror');
  });
  window.addEventListener('unhandledrejection', function(e){
    const reason = e && e.reason ? (e.reason.message || String(e.reason)) : 'Promise bị từ chối không rõ lý do';
    showFatalError(reason, 'unhandledrejection');
  });

  function showNotice(html){
    roomNotice.hidden = false;
    roomNotice.innerHTML = html;
  }

  if(!room){
    showNotice('Link chưa có mã phiên (room). Hãy quét lại mã QR mới từ WriteNote trên máy tính — không tự gõ link tay.');
    statusEl.textContent = 'Thiếu mã phiên';
  }

  let tool = 'pen';
  let color = '#1B2340';
  const WIDTH_PEN = 2, WIDTH_ERASER = 10;
  let drawing = false;
  let currentStrokeId = null;
  const remoteStrokes = {};

  function resize(){
    // QUAN TRỌNG: dùng clientWidth/clientHeight (kích thước layout, KHÔNG bị
    // ảnh hưởng bởi CSS transform zoom/pan) — chứ không dùng
    // getBoundingClientRect() (kích thước đã bị scale khi đang zoom), để
    // tránh việc phóng to lại vô tình resize luôn độ phân giải vẽ.
    const w = canvasViewport.clientWidth;
    const h = canvasViewport.clientHeight;
    if(w === baseWidth && h === baseHeight) return;
    const img = ctx.getImageData ? safeGetImage() : null;
    baseWidth = w; baseHeight = h;
    board.width = w * 2;
    board.height = h * 2;
    ctx.setTransform(2,0,0,2,0,0);
    if(img) ctx.putImageData(img,0,0);
  }
  function safeGetImage(){
    try{ return ctx.getImageData(0,0,board.width,board.height); }catch(e){ return null; }
  }
  window.addEventListener('resize', resize);
  resize();
  applyTransform();
  updatePageBadge();
  applyPageBackground();

  // Chạm vào ô "Trang X/Y" để yêu cầu laptop chuyển sang trang kế tiếp.
  // Laptop mới là nơi giữ dữ liệu thật của tài liệu nên điện thoại chỉ GỬI
  // YÊU CẦU qua socket; khi laptop đổi trang xong sẽ tự phát lại đúng nội
  // dung + kiểu nền của trang mới cho điện thoại (xem socket.on('change-page')).
  pageBadge.addEventListener('click', ()=>{
    if(!room || !socket || !socket.connected) return;
    socket.emit('nav-page', {room, direction:'next'});
  });

  document.getElementById('toolbar').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tool]');
    if(btn){
      tool = btn.dataset.tool;
      document.querySelectorAll('button[data-tool]').forEach(b=>b.classList.toggle('active', b===btn));
    }
    const sw = e.target.closest('.swatch');
    if(sw){
      color = sw.dataset.color;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s===sw));
    }
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    ctx.clearRect(0,0,board.width,board.height);
    if(socket && socket.connected) socket.emit('clear', {room, pageId: currentPageId});
  });

  function strokeStyleFor(t){
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(t==='eraser'){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineWidth=WIDTH_ERASER; }
    else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=color; ctx.lineWidth=WIDTH_PEN; }
  }

  // Quy đổi toạ độ CHẠM (màn hình) -> toạ độ TUYỆT ĐỐI trên tờ giấy (Logical
  // Canvas), bù trừ scale (zoom) hiện tại — bất kể đang zoom/pan thế nào,
  // kết quả trả về luôn nằm trong hệ [0..baseWidth] x [0..baseHeight] cố định,
  // giống hệt hệ toạ độ mà ctx dùng để vẽ (xem resize()).
  function getPos(e){
    const rect = board.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-rect.left)/scale, y:(t.clientY-rect.top)/scale };
  }

  function emitStrokeSegment(phase, x, y, strokeId){
    if(!socket || !socket.connected) return;
    const payload = {room, pageId: currentPageId, strokeId, phase};
    if(phase==='start'){
      payload.tool = tool;
      payload.color = color;
      // Chuẩn hoá độ dày nét theo baseWidth (giống hệt cách chuẩn hoá x/y
      // bên dưới), để khi laptop nhận và nhân lại theo board.width của nó,
      // độ dày hiển thị luôn ĐÚNG TỈ LỆ so với lúc viết trên điện thoại —
      // không còn bị mảnh/lệch do 2 canvas có độ phân giải khác nhau.
      payload.width = (tool==='eraser' ? WIDTH_ERASER : WIDTH_PEN) / baseWidth;
    }
    // Chia cho baseWidth/baseHeight (kích thước "tờ giấy" cố định lúc zoom
    // 100%, KHÔNG phải kích thước khung nhìn đang hiển thị) để toạ độ gửi đi
    // luôn là toạ độ tuyệt đối trên trang, khớp với Laptop dù đang zoom/pan.
    if(x!==null && x!==undefined){ payload.x = x/baseWidth; payload.y = y/baseHeight; }
    socket.emit('stroke', payload);
  }

  function beginStroke(e){
    drawing = true;
    const p = getPos(e);
    strokeStyleFor(tool);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    currentStrokeId = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    emitStrokeSegment('start', p.x, p.y, currentStrokeId);
  }
  function continueStroke(e){
    if(!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    if(currentStrokeId) emitStrokeSegment('move', p.x, p.y, currentStrokeId);
  }
  function endStroke(){
    if(!drawing) return;
    drawing = false;
    if(currentStrokeId) emitStrokeSegment('end', null, null, currentStrokeId);
    currentStrokeId = null;
  }

  // Tất cả tương tác chạm (vẽ 1 ngón, phóng to/kéo 2 ngón) đều lắng nghe trên
  // #canvasViewport — một hệ quy chiếu ỔN ĐỊNH không bị transform — để việc
  // quy đổi toạ độ luôn nhất quán, tách biệt hẳn khỏi canvas đang bị zoom/pan.
  canvasViewport.addEventListener('pointerdown', (e)=>{
    canvasViewport.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(activePointers.size === 1 && !suppressDraw){
      beginStroke(e);
    } else if(activePointers.size === 2){
      endStroke(); // huỷ nét đang vẽ dở bằng 1 ngón (nếu có) khi ngón thứ 2 chạm vào
      suppressDraw = true;
      beginPinch();
    }
  });
  canvasViewport.addEventListener('pointermove', (e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(activePointers.size >= 2){
      updatePinch();
    } else if(drawing){
      continueStroke(e);
    }
  });
  function releasePointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size < 2) pinch = null;
    if(activePointers.size === 0){
      suppressDraw = false;
      endStroke();
    }
  }
  canvasViewport.addEventListener('pointerup', releasePointer);
  canvasViewport.addEventListener('pointercancel', releasePointer);
  canvasViewport.addEventListener('pointerleave', (e)=>{ if(activePointers.size<=1) releasePointer(e); });

  /* ---- realtime ---- */
  diag.socketIoScriptLoaded = !window.__socketIoLoadFailed && typeof io === 'function';

  let socket = null;
  let connectTimeoutTimer = null;

  if(!diag.socketIoScriptLoaded){
    statusEl.textContent = 'Chỉ dùng ngoại tuyến';
    statusEl.classList.add('err');
    showNotice(
      'Không tải được thư viện realtime (<code>/socket.io/socket.io.js</code>).<br>' +
      'Bạn vẫn viết được trên trang này nhưng sẽ <b>không đồng bộ</b> với máy tính. Kiểm tra:' +
      '<ul>' +
        '<li>Server có đang chạy và có phục vụ Socket.io ở route mặc định không?</li>' +
        '<li>Điện thoại và máy tính có đang cùng một mạng Wi-Fi/LAN không?</li>' +
        '<li>Link QR có trỏ đúng địa chỉ IP của máy tính (không phải <code>localhost</code>) không?</li>' +
      '</ul>'
    );
  } else {
    socket = io({ reconnectionAttempts: Infinity, timeout: 8000 });

    // Nếu sau 6 giây vẫn chưa kết nối được -> chủ động đưa ra gợi ý thay vì im lặng chờ mãi
    connectTimeoutTimer = setTimeout(function(){
      if(!diag.socketConnected){
        showNotice(
          'Đang mất nhiều thời gian hơn bình thường để kết nối tới máy tính. Thường là do:' +
          '<ul>' +
            '<li>Link QR trỏ tới <code>localhost</code>/<code>127.0.0.1</code> thay vì địa chỉ IP LAN thật của máy tính.</li>' +
            '<li>Điện thoại và máy tính không cùng mạng Wi-Fi (ví dụ một bên đang dùng 4G/5G, hoặc mạng khách "Guest" bị cô lập).</li>' +
            '<li>Firewall trên máy tính đang chặn kết nối đến từ thiết bị khác trên cổng này.</li>' +
          '</ul>' +
          'Xem mục "Chi tiết" để biết chính xác trang đang cố kết nối tới đâu.'
        );
        debugPanel.hidden = false;
        renderDebug();
      }
    }, 6000);

    socket.on('connect', ()=>{
      diag.socketConnected = true;
      diag.lastEvent = 'connect';
      clearTimeout(connectTimeoutTimer);
      statusEl.textContent = 'Đã kết nối';
      statusEl.classList.remove('err');
      roomNotice.hidden = true;
      if(room) socket.emit('join-room', {room});
      renderDebug();
    });
    socket.on('disconnect', (reason)=>{
      diag.socketConnected = false;
      diag.lastEvent = 'disconnect (' + reason + ')';
      statusEl.textContent = 'Mất kết nối';
      statusEl.classList.add('err');
      renderDebug();
    });
    socket.on('reconnect_attempt', (n)=>{
      diag.reconnectAttempts = n;
      diag.lastEvent = 'reconnect_attempt #' + n;
      statusEl.textContent = 'Đang thử kết nối lại (lần ' + n + ')...';
      renderDebug();
    });
    socket.on('connect_error', (err)=>{
      diag.lastEvent = 'connect_error';
      diag.lastError = (err && err.message) ? err.message : String(err);
      statusEl.textContent = 'Lỗi kết nối';
      statusEl.classList.add('err');
      showNotice(
        'Không kết nối được tới máy tính (<code>' + diag.pageOrigin + '</code>).' +
        '<ul>' +
          '<li>Kiểm tra hai thiết bị cùng một mạng Wi-Fi.</li>' +
          '<li>Kiểm tra địa chỉ IP trong link — không được là <code>localhost</code> hay <code>127.0.0.1</code>.</li>' +
          '<li>Thử quét lại mã QR mới, hoặc chạm nút "Thử lại" bên dưới.</li>' +
        '</ul>' +
        '<button id="retryBtn" type="button" style="margin-top:6px;">Thử lại</button>'
      );
      const retryBtn = document.getElementById('retryBtn');
      if(retryBtn) retryBtn.addEventListener('click', ()=>{ location.reload(); });
      debugPanel.hidden = false;
      renderDebug();
    });

    socket.on('request-snapshot', ({forId})=>{
      socket.emit('snapshot-response', {
        forId, dataUrl: board.toDataURL(),
        pageId: currentPageId, pageName: currentPageName,
        pageIndex: currentPageIndex, pageCount: currentPageCount
      });
    });
    socket.on('snapshot', (p)=>{
      applyPageMeta(p);
      if(!p.dataUrl) return;
      const img = new Image();
      img.onload = ()=>{ ctx.clearRect(0,0,board.width,board.height); ctx.drawImage(img,0,0,baseWidth,baseHeight); };
      img.onerror = ()=>{ showFatalError('Không tải được ảnh snapshot từ máy tính.', 'snapshot'); };
      img.src = p.dataUrl;
    });
    // Vấn đề 2: Laptop đổi trang KHÔNG đổi room — chỉ gửi sự kiện này kèm
    // pageId + ảnh chụp trang mới, điện thoại tự chuyển sang hiển thị đúng
    // trang đó, không cần quét lại mã QR hay tải lại trang.
    socket.on('change-page', (p)=>{
      if(p.room!==room) return;
      applyPageMeta(p);
      remoteStrokes && Object.keys(remoteStrokes).forEach(k=>delete remoteStrokes[k]);
      ctx.clearRect(0,0,board.width,board.height);
      if(p.dataUrl){
        const img = new Image();
        img.onload = ()=>{ ctx.clearRect(0,0,board.width,board.height); ctx.drawImage(img,0,0,baseWidth,baseHeight); };
        img.onerror = ()=>{ showFatalError('Không tải được ảnh của trang mới.', 'change-page'); };
        img.src = p.dataUrl;
      }
    });
    socket.on('stroke', handleRemoteStroke);
    socket.on('shape', handleRemoteShape);
    socket.on('text', handleRemoteText);
    socket.on('clear', (p)=>{
      if(p.room!==room) return;
      if(currentPageId && p.pageId && p.pageId!==currentPageId) return;
      ctx.clearRect(0,0,board.width,board.height);
    });
  }

  // Với room dùng chung cho cả tài liệu (nhiều trang), mọi gói tin vẽ đến từ
  // trang KHÁC với trang đang xem trên điện thoại sẽ bị bỏ qua.
  function isForCurrentPage(p){
    if(p.room!==room) return false;
    if(currentPageId && p.pageId && p.pageId!==currentPageId) return false;
    return true;
  }

  // ===== Vẽ lại nét vẽ nhận từ Laptop (hoặc điện thoại khác) =====
  // Dùng đúng kỹ thuật làm mượt "trung điểm + đường cong bậc 2" như bên
  // laptop: nối trung điểm của cặp điểm liền trước với trung điểm của cặp
  // điểm hiện tại bằng một đường cong (control point = điểm chạm ở giữa),
  // thay vì nối thẳng — giúp chữ nhận từ laptop cũng mượt mà, không góc cạnh.
  function handleRemoteStroke(p){
    if(!isForCurrentPage(p)) return;
    if(p.phase==='start'){
      const x = p.x*baseWidth, y = p.y*baseHeight;
      remoteStrokes[p.strokeId] = {
        prevRaw: {x, y}, prevMid: {x, y},
        tool: p.tool, color: p.color,
        width: (p.width || 0) * baseWidth
      };
      return;
    }
    const st = remoteStrokes[p.strokeId];
    if(!st) return;
    if(p.phase==='move'){
      const x = p.x*baseWidth, y = p.y*baseHeight;
      const mid = { x: (st.prevRaw.x + x) / 2, y: (st.prevRaw.y + y) / 2 };
      ctx.save();
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.globalCompositeOperation = st.tool==='eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = st.tool==='eraser' ? 'rgba(0,0,0,1)' : st.color;
      ctx.lineWidth = st.width;
      ctx.beginPath();
      ctx.moveTo(st.prevMid.x, st.prevMid.y);
      ctx.quadraticCurveTo(st.prevRaw.x, st.prevRaw.y, mid.x, mid.y);
      ctx.stroke();
      ctx.restore();
      st.prevMid = mid;
      st.prevRaw = {x, y};
    } else if(p.phase==='end'){
      // Vẽ nốt đoạn cuối tới điểm chạm cuối; nếu chỉ tap (không kéo) thì
      // đoạn có độ dài 0 -> lineCap:'round' tự vẽ thành 1 chấm tròn.
      ctx.save();
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.globalCompositeOperation = st.tool==='eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = st.tool==='eraser' ? 'rgba(0,0,0,1)' : st.color;
      ctx.lineWidth = st.width;
      ctx.beginPath();
      ctx.moveTo(st.prevMid.x, st.prevMid.y);
      ctx.lineTo(st.prevRaw.x, st.prevRaw.y);
      ctx.stroke();
      ctx.restore();
      delete remoteStrokes[p.strokeId];
    }
  }
  function handleRemoteShape(p){
    if(!isForCurrentPage(p)) return;
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=p.color; ctx.lineWidth=(p.width || 0)*baseWidth; ctx.globalCompositeOperation='source-over';
    const x1=p.x1*baseWidth, y1=p.y1*baseHeight, x2=p.x2*baseWidth, y2=p.y2*baseHeight;
    if(p.shape==='line' || p.shape==='arrow'){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    else if(p.shape==='rect'){ ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1)); }
    else if(p.shape==='ellipse'){ ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2); ctx.stroke(); }
    else if(p.shape==='triangle'){ ctx.beginPath(); ctx.moveTo((x1+x2)/2,y1); ctx.lineTo(x1,y2); ctx.lineTo(x2,y2); ctx.closePath(); ctx.stroke(); }
    ctx.restore();
  }
  function handleRemoteText(p){
    if(!isForCurrentPage(p)) return;
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.font = p.fontSize*baseWidth + "px 'Caveat', cursive";
    ctx.textBaseline='top';
    const x=p.x*baseWidth, y=p.y*baseHeight;
    p.text.split('\n').forEach((line,i)=>{ ctx.fillText(line, x, y+i*(p.fontSize*baseWidth+4)); });
    ctx.restore();
  }
})();
</script>
</body>
</html>
