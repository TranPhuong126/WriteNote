  async function getQrServerBase(){
    const input = document.getElementById('serverAddr');
    const loc = window.location;

    // Trang đang được mở qua một địa chỉ mà điện thoại CŨNG dùng được thẳng
    // (domain công khai như Render, hoặc IP LAN thật kiểu 192.168.x.x) —
    // dùng ngay chính địa chỉ đó, không cần dò thêm.
    if(loc.hostname !== 'localhost' && loc.hostname !== '127.0.0.1'){
      const base = loc.origin;
      input.value = base;
      return base;
    }

    // Chỉ khi mở bằng "localhost" (chạy thử trên máy) mới cần dò IP LAN thật,
    // vì "localhost" trên điện thoại sẽ trỏ vào chính điện thoại chứ không
    // phải máy tính. Lưu ý: /network-address chỉ đáng tin trên máy chủ chạy
    // cục bộ — trên môi trường cloud như Render, đây là IP nội bộ container
    // (không phải mạng LAN thật) nên không dùng cho trường hợp domain công khai ở trên.
    const currentBase = input.value.replace(/\/$/,'') || loc.origin;
    try{
      const response = await fetch('/network-address', {cache:'no-store'});
      if(response.ok){
        const network = await response.json();
        if(network.address && network.port){
          const base = loc.protocol + '//' + network.address + ':' + network.port;
          input.value = base;
          return base;
        }
      }
    }catch(error){}
    return currentBase;
  }

  async function regenerateQr(){
    const base = await getQrServerBase();
    // room = id của TÀI LIỆU (cố định suốt phiên làm việc), page chỉ là tham
    // số tham khảo ban đầu — không dùng room = id của TRANG nữa, vì đổi trang
    // sẽ không còn làm đổi room/mất kết nối điện thoại (xem broadcastPageChange()).
    const url = base + '/mobile.html?room=' + encodeURIComponent(currentDocument().id) +
      '&page=' + encodeURIComponent(currentPage().id);
    document.getElementById('directLink').value = url;
    const qrContainer = document.getElementById('qrCanvas');
    qrContainer.innerHTML = '';
    qrContainer.style.background = '#FFFFFF';
    if(typeof window.QRCode === 'function'){
      try{
        new window.QRCode(qrContainer, {
          text:url,
          width:220,
          height:220,
          colorDark:'#1B2340',
          colorLight:'#FFFFFF',
          correctLevel:window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : 0
        });
        return;
      }catch(error){}
    }
    if(window.QRCode && typeof window.QRCode.toCanvas === 'function'){
      const canvas = document.createElement('canvas');
      canvas.width = 220;
      canvas.height = 220;
      qrContainer.appendChild(canvas);
      window.QRCode.toCanvas(canvas, url, {width:220, margin:1, errorCorrectionLevel:'M'}, function(error){
        if(error) document.getElementById('connStatus').textContent = 'Không tạo được mã QR';
      });
      return;
    }
    document.getElementById('connStatus').textContent = 'Thư viện QR chưa tải được';
  }

  function connectSocket(){
    const base = document.getElementById('serverAddr').value.replace(/\/$/,'');
    if(!base) return;
    if(socket){ socket.disconnect(); }
    socket = io(base, {transports:['websocket','polling']});
    const statusEl = document.getElementById('connStatus');
    statusEl.textContent = 'Đang kết nối...';
    socket.on('connect', ()=>{
      statusEl.textContent = 'Đã kết nối';
      // room = tài liệu (không đổi khi chuyển trang) — xem ghi chú tại regenerateQr().
      joinRoom(currentDocument().id);
      broadcastPageChange();
    });
    socket.on('disconnect', ()=>{ statusEl.textContent = 'Mất kết nối'; });
    socket.on('connect_error', (err)=>{
      statusEl.textContent = 'Không kết nối được tới máy chủ' + (err && err.message ? ' (' + err.message + ')' : '');
    });
    bindSocketEvents();
  }
  document.getElementById('connectBtn').addEventListener('click', connectSocket);

  function joinRoom(roomId){
    if(!socket || !socket.connected) return;
    currentRoom = roomId;
    socket.emit('join-room', {room: roomId});
  }

  // Với room dùng chung cho cả tài liệu (nhiều trang), phải kèm pageId vào
  // mọi gói tin vẽ để phân biệt "vẽ cho trang nào" — tránh nét vẽ của trang
  // khác lẫn vào trang đang xem.
  function pageIndexOf(page){ return currentDocument().pages.indexOf(page); }

  function broadcastPageChange(){
    if(!socket || !socket.connected || !currentRoom) return;
    const p = currentPage();
    socket.emit('change-page', {
      room: currentRoom,
      pageId: p.id,
      pageName: p.name,
      pageIndex: pageIndexOf(p),
      pageCount: currentDocument().pages.length,
      // Kèm kiểu nền + màu nền trang để điện thoại vẽ lại đúng "tờ giấy"
      // đang hiển thị trên laptop (yêu cầu đồng bộ giao diện trang).
      bg: p.bg,
      bgColor: p.bgColor,
      dataUrl: board ? board.toDataURL() : null
    });
  }

  function bindSocketEvents(){
    socket.on('request-snapshot', ({forId})=>{
      const p = currentPage();
      socket.emit('snapshot-response', {
        forId,
        dataUrl: board.toDataURL(),
        pageId: p.id,
        pageName: p.name,
        pageIndex: pageIndexOf(p),
        pageCount: currentDocument().pages.length,
        bg: p.bg,
        bgColor: p.bgColor
      });
    });
    socket.on('snapshot', ({dataUrl})=>{
      if(!dataUrl) return;
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img,0,0,board.width,board.height); pushHistory(); };
      img.src = dataUrl;
    });
    // Điện thoại là thiết bị "theo sau" — laptop mới là nơi tạo/xoá/chuyển
    // trang, nên laptop bỏ qua sự kiện change-page đến từ nơi khác (nếu có).
    socket.on('change-page', ()=>{});
    socket.on('stroke', (p)=>{ if(p.room===currentRoom && p.pageId===currentPage().id) applyRemoteStroke(p); });
    socket.on('shape', (p)=>{ if(p.room===currentRoom && p.pageId===currentPage().id) applyRemoteShape(p); });
    socket.on('text', (p)=>{ if(p.room===currentRoom && p.pageId===currentPage().id) applyRemoteText(p); });
    socket.on('clear', (p)=>{
      if(p.room!==currentRoom || p.pageId!==currentPage().id) return;
      currentPage().data = null;
      currentPage().elements = [];
      ctx.clearRect(0,0,board.width,board.height);
      const container = document.querySelector('.page-sheet.active .page-elements');
      if(container) renderPageElements(currentPage(), container);
      saveState();
    });
    socket.on('peer-joined', ({count})=>{ document.getElementById('connStatus').textContent = 'Đã kết nối — ' + count + ' thiết bị khác'; broadcastPageChange(); });
    socket.on('peer-left', ({count})=>{ document.getElementById('connStatus').textContent = 'Đã kết nối — ' + count + ' thiết bị khác'; });

    // Điện thoại chạm vào ô "Trang X/Y" để yêu cầu đổi trang. Laptop là nơi
    // giữ dữ liệu thật nên tự chuyển trang bằng switchToPage() có sẵn (hàm
    // này đã tự lo lưu snapshot trang cũ + broadcastPageChange() trang mới),
    // rồi mọi thiết bị trong room (kể cả điện thoại vừa yêu cầu) sẽ nhận lại
    // đúng trang mới qua sự kiện 'change-page' như bình thường.
    socket.on('nav-page', (p)=>{
      if(!p || p.room!==currentRoom) return;
      const doc = currentDocument();
      const total = doc.pages.length;
      if(total <= 0) return;
      let idx = doc.currentPage;
      if(p.direction === 'prev') idx = (idx - 1 + total) % total;
      else idx = (idx + 1) % total;
      switchToPage(idx);
    });
  }

  // Với hệ toạ độ x/y đã được chuẩn hoá theo bề rộng/cao "tờ giấy" (0..1) để
  // khớp giữa laptop (board.width=1190) và điện thoại (baseWidth tuỳ màn
  // hình), độ dày nét (width) cũng cần chuẩn hoá THEO ĐÚNG CÁCH ĐÓ — chia
  // cho board.width khi gửi đi — nếu không, nét vẽ từ điện thoại (baseWidth
  // nhỏ, ví dụ ~400px) sang laptop (board.width=1190px) sẽ bị SAI TỈ LỆ độ
  // dày, khiến chữ trông mảnh/khác hẳn so với lúc viết trên điện thoại.
  function emitStrokeSegment(phase, x, y, strokeId){
    if(!socket || !socket.connected || !currentRoom) return;
    const payload = {room: currentRoom, pageId: currentPage().id, strokeId, phase};
    if(phase==='start'){
      payload.tool = tool;
      payload.color = state.color;
      payload.width = (tool==='eraser' ? state.stroke*3 : state.stroke) / board.width;
    }
    if(x!==null && x!==undefined){ payload.x = x/board.width; payload.y = y/board.height; }
    socket.emit('stroke', payload);
  }
  function emitShape(shape, x1,y1,x2,y2){
    if(!socket || !socket.connected || !currentRoom) return;
    socket.emit('shape', {room: currentRoom, pageId: currentPage().id, shape, color: state.color, width: state.stroke / board.width, x1,y1,x2,y2});
  }
  function emitText(text, x, y, fontSize){
    if(!socket || !socket.connected || !currentRoom) return;
    socket.emit('text', {room: currentRoom, pageId: currentPage().id, text, x, y, color: state.color, fontSize});
  }
  function emitClear(){
    if(!socket || !socket.connected || !currentRoom) return;
    socket.emit('clear', {room: currentRoom, pageId: currentPage().id});
  }

  // ===== Vẽ lại nét vẽ nhận từ xa (điện thoại -> laptop hoặc laptop khác) =====
  // Trước đây mỗi điểm chạm được nối bằng ĐOẠN THẲNG (ctx.lineTo). Khi các
  // điểm này (lấy từ một canvas nhỏ như màn hình điện thoại) được nhân tỉ lệ
  // lên một canvas lớn hơn nhiều (board.width=1190 của laptop), khoảng cách
  // giữa các điểm bị "kéo giãn" ra, làm lộ rõ các góc gãy khúc -> chữ trông
  // nguệch ngoạc dù trên điện thoại nhìn mượt.
  // Khắc phục bằng kỹ thuật làm mượt nét vẽ tay phổ biến "trung điểm + đường
  // cong bậc 2" (quadratic mid-point smoothing): với 2 điểm chạm liên tiếp,
  // vẽ một đường cong từ trung điểm của cặp điểm TRƯỚC tới trung điểm của
  // cặp điểm HIỆN TẠI, dùng điểm chạm ở giữa làm điểm điều khiển (control
  // point) của đường cong. Kỹ thuật này chỉ cần nhớ 2 điểm gần nhất (không
  // cần đổi giao thức truyền dữ liệu), cho nét cong tự nhiên hơn hẳn so với
  // nối thẳng, đặc biệt rõ khi phóng to sang canvas độ phân giải khác.
  // Giới hạn an toàn cho độ dày nét nhận từ xa: không cho phép quá 15% chiều
  // rộng trang giấy. Đây là lưới an toàn cuối cùng chống lỗi "canvas bị tô
  // đen toàn bộ" — nếu vì bất kỳ lý do gì (mất gói tin, lệch thời điểm đo
  // kích thước ở thiết bị gửi, dữ liệu hỏng...) một gói tin đến với độ dày
  // được chuẩn hoá sai và bị phóng đại hàng chục/hàng trăm lần, ctx.lineWidth
  // sẽ không bao giờ đủ lớn để một nét vẽ đơn phủ kín cả trang.
  const MAX_REMOTE_STROKE_WIDTH_RATIO = 0.15;
  function sanitizeRemoteWidth(rawWidth, board){
    const w = Number(rawWidth) || 0;
    if(!Number.isFinite(w) || w <= 0) return 1;
    const maxAllowed = Math.min(board.width, board.height) * MAX_REMOTE_STROKE_WIDTH_RATIO;
    return Math.min(w, maxAllowed);
  }
  function applyRemoteStroke(p){
    if(p.phase==='start'){
      // Bỏ qua toạ độ không hợp lệ (NaN/Infinity/null) thay vì để chúng biến
      // thành 0 một cách âm thầm (0*NaN, null*n=0...) và vẽ nhầm từ góc trang.
      if(!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
      const x = p.x*board.width, y = p.y*board.height;
      remoteStrokes[p.strokeId] = {
        prevRaw: {x, y}, prevMid: {x, y},
        tool: p.tool, color: p.color,
        width: sanitizeRemoteWidth((p.width || 0) * board.width, board)
      };
      return;
    }
    const st = remoteStrokes[p.strokeId];
    if(!st) return;
    if((p.phase==='move' || p.phase==='end') && p.x!==null && p.x!==undefined && (!Number.isFinite(p.x) || !Number.isFinite(p.y))) return;
    if(p.phase==='move'){
      const x = p.x*board.width, y = p.y*board.height;
      const mid = { x: (st.prevRaw.x + x) / 2, y: (st.prevRaw.y + y) / 2 };
      ctx.save();
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.globalCompositeOperation = st.tool==='eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = st.tool==='eraser' ? 'rgba(0,0,0,1)' : st.color;
      ctx.lineWidth = st.width;
      ctx.beginPath();
      ctx.moveTo(st.prevMid.x, st.prevMid.y);
      ctx.quadraticCurveTo(st.prevRaw.x, st.prevRaw.y, mid.x, mid.y);
      ctx.stroke();
      ctx.restore();
      st.prevMid = mid;
      st.prevRaw = {x, y};
    } else if(p.phase==='end'){
      // Vẽ nốt đoạn cuối tới đúng điểm chạm cuối cùng để nét không hụt mất
      // nửa đoạn cuối. Nếu người dùng chỉ CHẠM (không kéo) thì prevMid và
      // prevRaw trùng nhau -> đoạn dài 0, nhờ lineCap:'round' tự vẽ thành
      // 1 chấm tròn, đúng hành vi của một cú tap.
      ctx.save();
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.globalCompositeOperation = st.tool==='eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = st.tool==='eraser' ? 'rgba(0,0,0,1)' : st.color;
      ctx.lineWidth = st.width;
      ctx.beginPath();
      ctx.moveTo(st.prevMid.x, st.prevMid.y);
      ctx.lineTo(st.prevRaw.x, st.prevRaw.y);
      ctx.stroke();
      ctx.restore();
      delete remoteStrokes[p.strokeId];
      saveCurrentSnapshot(); saveState();
    }
  }

  function applyRemoteShape(p){
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=p.color; ctx.lineWidth=sanitizeRemoteWidth((p.width || 0)*board.width, board);
    const x1=p.x1*board.width, y1=p.y1*board.height, x2=p.x2*board.width, y2=p.y2*board.height;
    if(p.shape==='line'){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    else if(p.shape==='arrow'){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); drawArrowHead(x1,y1,x2,y2); }
    else if(p.shape==='rect'){ ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1)); }
    else if(p.shape==='ellipse'){ ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2); ctx.stroke(); }
    else if(p.shape==='triangle'){ ctx.beginPath(); ctx.moveTo((x1+x2)/2,y1); ctx.lineTo(x1,y2); ctx.lineTo(x2,y2); ctx.closePath(); ctx.stroke(); }
    ctx.restore();
    saveCurrentSnapshot(); saveState();
  }

  function applyRemoteText(p){
    ctx.save();
    ctx.fillStyle = p.color;
    const px = p.fontSize*board.width;
    ctx.font = px + "px 'Segoe UI','Inter',sans-serif";
    ctx.textBaseline='top';
    const x=p.x*board.width, y=p.y*board.height;
    p.text.split('\n').forEach((line,i)=>{ ctx.fillText(line, x, y+i*(px+4)); });
    ctx.restore();
    saveCurrentSnapshot(); saveState();
  }

  function init(){
    renderSwatches();
    renderDocSelect();
    renderDocumentStack();
    updateStrokeUI();
    strokeRange.value = state.stroke;
    document.getElementById('customColor').value = state.color;
    applyBgClass();
    renderBgSwatches();
    if(board){
      setTimeout(()=>{ history=[board.toDataURL()]; historyIndex=0; }, 60);
    }
  }
  init();

  // Tự động kết nối realtime NGAY KHI TẢI TRANG, không chờ người dùng mở
  // hộp thoại "Liên kết điện thoại" hay bấm nút "Kết nối" thủ công. Đây là
  // nguyên nhân chính khiến trước đây nét vẽ từ laptop không tới điện thoại
  // trừ khi vào tab liên kết và bấm kết nối: nếu chưa từng mở hộp thoại đó,
  // biến `socket` vẫn là null nên mọi emitStrokeSegment/emitShape/emitText
  // đều bị bỏ qua ngay từ đầu (điều kiện `if(!socket...) return;`).
  (async function autoConnectPhoneSync(){
    try{ await getQrServerBase(); }catch(e){}
    if(!socket || !socket.connected) connectSocket();
  })();

  window.addEventListener('beforeunload', saveCurrentSnapshot);
})();
</script>
</body>
</html>
